<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jewel Gabriel Paul — Portfolio Header</title>
  <desc id="desc">Second-year B.Tech CSE (AI &amp; ML) student at LNCTS Bhopal specializing in Applied AI, Multimodal Workflows, and Digital Product Development.</desc>
  
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15"/>
      <stop offset="45%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#071922"/>
    </linearGradient>

    <!-- Neon Teal / Cyan Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2F7F5"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0B1322" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowTeal" cx="85%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="15%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <!-- High-tech Grid Pattern -->
    <pattern id="techGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#334155" stroke-opacity="0.28" stroke-width="0.8"/>
      <circle cx="36" cy="36" r="1" fill="#2DD4BF" fill-opacity="0.35"/>
    </pattern>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes pulseSlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.04); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes beacon {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }

      .pulse-ring { transform-origin: 1020px 155px; animation: pulseSlow 5s ease-in-out infinite; }
      .spin-ring { transform-origin: 1020px 155px; animation: spinSlow 32s linear infinite; }
      .spin-rev { transform-origin: 1020px 155px; animation: spinReverse 24s linear infinite; }
      .beacon-dot { animation: beacon 2s ease-in-out infinite; }
      .dash-circle { stroke-dasharray: 6 6; animation: dashAnim 4s linear infinite; }
      
      .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
  </defs>

  <!-- Container Box with Glowing Border -->
  <rect x="1.5" y="1.5" width="1197" height="317" rx="18" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="18" fill="url(#techGrid)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="18" fill="url(#glowTeal)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="18" fill="url(#glowBlue)"/>

  <!-- Top Accent Bar: High-Tech Cyber Gradient -->
  <path d="M 2 18 C 2 9.16 9.16 2 18 2 L 1182 2 C 1190.84 2 1198 9.16 1198 18 L 1198 6 L 2 6 Z" fill="url(#accentGrad)" opacity="0.95"/>

  <!-- Left Glowing Accent Anchor -->
  <rect x="58" y="58" width="4" height="204" rx="2" fill="url(#accentGrad)"/>

  <!-- Left Content Group -->
  <g transform="translate(86, 0)">
    <!-- Status Chip with Pulsing Green Dot -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="280" height="26" rx="13" fill="#0E1726" stroke="#1E293B" stroke-width="1"/>
      <circle cx="14" cy="13" r="4.5" fill="#10B981" class="beacon-dot"/>
      <circle cx="14" cy="13" r="8" fill="#10B981" opacity="0.25" class="beacon-dot"/>
      <text x="28" y="17" class="font-mono" font-size="11" font-weight="600" fill="#2DD4BF" letter-spacing="0.1em">PORTFOLIO &amp; SYSTEMS LAB</text>
    </g>

    <!-- Primary Name -->
    <text x="0" y="126" class="font-sans" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="0.02em">JEWEL GABRIEL PAUL</text>

    <!-- Subtitle: Academic Standing & Specialization -->
    <text x="2" y="165" class="font-sans" font-size="19" font-weight="500" fill="#94A3B8">
      Second-year B.Tech CSE (AI &amp; ML) · <tspan fill="#F1F5F9" font-weight="600">LNCTS Bhopal</tspan>
    </text>

    <!-- Focus Tags in Modern Cyber Badges -->
    <g transform="translate(2, 202)">
      <!-- Badge 1: Applied AI -->
      <g transform="translate(0, 0)">
        <rect width="138" height="32" rx="7" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="3.5" fill="#2DD4BF"/>
        <text x="28" y="20" class="font-mono" font-size="11.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.04em">APPLIED AI</text>
      </g>

      <!-- Badge 2: Multimodal Workflows -->
      <g transform="translate(148, 0)">
        <rect width="218" height="32" rx="7" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="3.5" fill="#38BDF8"/>
        <text x="28" y="20" class="font-mono" font-size="11.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.04em">MULTIMODAL WORKFLOWS</text>
      </g>

      <!-- Badge 3: Digital Product Development -->
      <g transform="translate(376, 0)">
        <rect width="250" height="32" rx="7" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
        <circle cx="16" cy="16" r="3.5" fill="#818CF8"/>
        <text x="28" y="20" class="font-mono" font-size="11.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.04em">DIGITAL PRODUCTS &amp; APPS</text>
      </g>
    </g>

    <!-- Philosophy Tagline -->
    <text x="3" y="274" class="font-mono" font-size="12" fill="#64748B" letter-spacing="0.06em">
      ORCHESTRATING MULTI-MODEL AI &amp; CRAFTING PRACTICAL DIGITAL EXPERIENCES
    </text>
  </g>

  <!-- Right Visual: Animated Multi-Model Orbital Nexus -->
  <g id="orbital-nexus">
    <!-- Ambient Pulse Ring -->
    <circle cx="1020" cy="155" r="106" fill="none" stroke="#2DD4BF" stroke-opacity="0.18" stroke-width="1" class="pulse-ring"/>

    <!-- Outer Rotating Coordinate Ring -->
    <g class="spin-ring">
      <circle cx="1020" cy="155" r="92" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4 8"/>
      <circle cx="1112" cy="155" r="4.5" fill="#2DD4BF"/>
      <circle cx="928" cy="155" r="3.5" fill="#38BDF8"/>
      <circle cx="1020" cy="63" r="4" fill="#818CF8"/>
      <circle cx="1020" cy="247" r="3.5" fill="#34D399"/>
    </g>

    <!-- Inner Reverse Rotating Dashed Ring -->
    <g class="spin-rev">
      <circle cx="1020" cy="155" r="66" fill="none" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.4" class="dash-circle"/>
      <circle cx="1076" cy="120" r="3.5" fill="#5EEAD4"/>
      <circle cx="964" cy="190" r="3.5" fill="#5EEAD4"/>
    </g>

    <!-- Core Hexagonal/Octagonal Hub -->
    <circle cx="1020" cy="155" r="44" fill="#0F172A" stroke="#2DD4BF" stroke-width="1.8"/>
    <circle cx="1020" cy="155" r="36" fill="#132337" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Crosshair Coordinates -->
    <line x1="984" y1="155" x2="1056" y2="155" stroke="#2DD4BF" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="1020" y1="119" x2="1020" y2="191" stroke="#2DD4BF" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Central Tech Monogram -->
    <text x="1020" y="151" class="font-mono" font-size="12" font-weight="800" fill="#5EEAD4" text-anchor="middle" letter-spacing="0.12em">AI · ML</text>
    <text x="1020" y="167" class="font-mono" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="0.14em">NEXUS</text>
  </g>

  <!-- Bottom Location & Terminal Meta -->
  <g transform="translate(1142, 290)">
    <text x="0" y="0" class="font-mono" font-size="10.5" fill="#475569" text-anchor="end" letter-spacing="0.08em">
      📍 BHOPAL, INDIA  ·  23.2599° N, 77.4126° E
    </text>
  </g>
</svg>